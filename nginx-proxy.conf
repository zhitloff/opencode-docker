events {
    worker_connections 1024;
}

http {
    # Проксирование UI opencode (порт 4096)
    server {
        listen 4096;
        server_name localhost;

        location / {
            proxy_pass http://opencode:4096;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Проксирование LM Studio API (порт 1234)
    server {
        listen 1234;
        server_name localhost;

        location / {
            proxy_pass http://host.docker.internal:1234;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Проксирование API LLM провайдера odirouter.ai (порт 1235)
    server {
        listen 1235;
        server_name localhost;

        location / {
            proxy_pass https://api.odirouter.ai;

            # Важно: Host должен быть api.odirouter.ai, а не $host
            proxy_set_header Host api.odirouter.ai;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ключевые директивы для HTTPS upstream
            proxy_ssl_server_name on;
            proxy_ssl_name api.odirouter.ai;
        }
    }
}